name: codeql-public-only

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-repository-boundary:
    if: ${{ github.event.repository.private }}
    name: private repository — CodeQL not run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the private-repository boundary
        run: |
          echo "GitHub CodeQL code scanning is not run for this private repository."
          echo "The clean-checkout workflow remains the hosted regression check."
          echo "CodeQL analysis will run automatically if this repository becomes public."

  analyze:
    if: ${{ github.event.repository.private == false }}
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}
