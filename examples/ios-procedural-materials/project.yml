name: WorldbendProceduralReceiving
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  WorldbendAppearance:
    path: ../../packages/swiftui
targets:
  WorldbendProceduralReceiving:
    type: application
    platform: iOS
    sources:
      - App
      - path: Receipts
        type: group
    dependencies:
      - package: WorldbendAppearance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openadam.worldbend.procedural-receiving
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
schemes:
  WorldbendProceduralReceiving:
    build:
      targets:
        WorldbendProceduralReceiving: all
