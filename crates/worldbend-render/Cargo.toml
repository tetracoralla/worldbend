[package]
name = "worldbend-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Native reference raster renderer for Worldbend"

[features]
default = ["place", "deform", "remap", "timeline"]
place = ["worldbend-core/place"]
deform = ["worldbend-core/deform"]
remap = ["worldbend-core/remap"]
timeline = ["worldbend-core/timeline"]

[dependencies]
image.workspace = true
libc.workspace = true
worldbend-core = { path = "../worldbend-core", default-features = false }
rayon.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
