[package]
name = "worldbend-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "MCP adapter for Worldbend"

[features]
default = ["full"]
full = [
    "worldbend-core/surface-deformation",
    "worldbend-core/motion",
    "worldbend-core/css",
    "worldbend-core/place",
    "worldbend-core/deform",
    "worldbend-core/remap",
    "worldbend-core/timeline",
    "worldbend-core/program",
    "worldbend-core/template",
    "worldbend-render/place",
    "worldbend-render/deform",
    "worldbend-render/remap",
    "worldbend-render/timeline",
    "worldbend-render/program",
    "worldbend-render/template",
    "worldbend-render/surface-deformation",
    "worldbend-render/motion",
]

[[bin]]
name = "worldbend-mcp"
path = "src/main.rs"

[dependencies]
hex = "0.4"
anyhow.workspace = true
clap.workspace = true
futures = "0.3"
libc.workspace = true
worldbend-agent-fs = { path = "../worldbend-agent-fs" }
worldbend-core = { path = "../worldbend-core", default-features = false }
worldbend-render = { path = "../worldbend-render", default-features = false }
worldbend-perception = { path = "../worldbend-perception" }
worldbend-interop = { path = "../worldbend-interop" }
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
image.workspace = true
