[package]
license.workspace = true
name = "worldbend-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Canonical projective plane-mapping model, solver, validation, and diagnostics"

[features]
default = ["css", "place", "deform", "surface-deformation", "deformation-work", "surface-window", "spatial-effects", "appearance", "remap", "timeline", "motion", "video", "program", "template", "document"]
css = []
surface-window = ["css"]
spatial-effects = ["surface-window", "dep:sha2", "serde_json/float_roundtrip"]
appearance = ["dep:sha2", "serde_json/float_roundtrip"]
place = []
deform = []
surface-deformation = ["deform"]
deformation-work = ["surface-deformation", "place"]
remap = []
timeline = []
motion = ["timeline", "place", "template", "dep:sha2", "serde_json/float_roundtrip"]
video = ["motion"]
program = ["deformation-work", "remap"]
template = ["place", "program"]
document = ["template", "spatial-effects", "appearance", "video"]

[dependencies]
sha2 = { workspace = true, optional = true }
nalgebra.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
approx = "0.5.1"
proptest.workspace = true
# Offline build-time WGSL -> Metal projection; never linked into a carrier.
naga = { version = "=30.0.1", features = ["wgsl-in", "msl-out"] }

[[example]]
name = "generate-material-metal"
required-features = ["appearance"]

[[example]]
name = "generate-native-material-receipts"
required-features = ["appearance"]

[[example]]
name = "generate-native-preference-rules"
required-features = ["appearance"]

[[example]]
name = "generate-native-preference-fixtures"
required-features = ["appearance"]
