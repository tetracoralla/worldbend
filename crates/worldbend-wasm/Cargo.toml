[package]
name = "worldbend-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "WASM geometry bridge for Worldbend web and Figma adapters"

[features]
default = ["css"]
css = ["worldbend-core/css"]
designer = ["worldbend-core/place", "worldbend-core/deform", "worldbend-core/remap"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worldbend-core = { path = "../worldbend-core", default-features = false }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
