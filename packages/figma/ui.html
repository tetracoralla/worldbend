                  <span id="position-x-label" class="transform-label">X</span>
                  <span class="transform-value"><input id="position-x" class="transform-number" type="number" step="1" value="0" inputmode="decimal" aria-labelledby="position-x-label"><span id="position-x-unit" class="transform-unit">px</span></span>
                </div>
                <div class="position-row">
                  <span id="position-y-label" class="transform-label">Y</span>
                  <span class="transform-value"><input id="position-y" class="transform-number" type="number" step="1" value="0" inputmode="decimal" aria-labelledby="position-y-label"><span id="position-y-unit" class="transform-unit">px</span></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>
      <div id="editor"></div>
      <footer id="action-dock">
        <button id="reset" type="button">Reset</button>
        <p id="status" role="status" aria-live="polite"></p>
        <button id="apply" class="primary" type="button" disabled>Apply as image</button>
      </footer>
      <div id="error" role="alert" hidden><span id="error-text"></span><button id="error-dismiss" type="button" aria-label="Dismiss error">×</button></div>
      <output id="zoom-level" class="sr-only" aria-live="polite">100%</output>
    </section>
    <section id="canvas-workspace" class="task-workspace" aria-label="Canvas variants" hidden></section>
    <section id="mockup-workspace" class="task-workspace" aria-label="Mockup" hidden></section>
    <section id="mesh-workspace" class="task-workspace" aria-label="Mesh" hidden></section>
    <section id="remap-workspace" class="task-workspace" aria-label="Remap" hidden></section>
    <script type="module" src="/src/ui.ts"></script>
  </body>
</html>
