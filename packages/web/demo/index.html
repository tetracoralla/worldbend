<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worldbend</title>
    <link rel="icon" href="data:," />
    <link rel="preload" href="./worldbend-demo-source.png" as="image" />
    <link rel="preload" href="./plane.worldbend.json" as="fetch" crossorigin />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Worldbend</h1>
        <button id="open" type="button">Open image</button>
        <input id="source" type="file" accept="image/png,image/jpeg,image/webp" hidden />
      </header>
      <p id="error" role="alert" hidden></p>
      <section id="workspace" aria-label="Worldbend playground" hidden>
        <div id="editor" aria-label="Interactive transform preview">
          <p id="editor-hint">Drag the four corners</p>
        </div>
        <button id="developer-toggle" class="developer-toggle" type="button" aria-label="Developer mode" aria-expanded="false" aria-controls="developer-output" data-tooltip="Developer mode">
          <svg class="developer-icon" data-icon-id="icon-park:code" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M16 13L4 25.4322L16 37" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M32 13L44 25.4322L32 37" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M28 4L21 44" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
          </svg>
        </button>
        <aside id="developer-output" class="developer-output" aria-label="Developer output" hidden>
          <div class="outputs">
            <section class="output-panel">
              <header><h2>TransformSpec</h2><button id="copy-spec" type="button">Copy JSON</button></header>
              <pre id="spec-output" tabindex="0"></pre>
            </section>
            <section class="output-panel">
              <header><h2>CSS</h2><button id="copy-css" type="button">Copy CSS</button></header>
              <pre id="css-output" tabindex="0"></pre>
            </section>
          </div>
        </aside>
        <footer>
          <button id="reset" type="button">Reset</button>
          <div class="zoom-controls" role="group" aria-label="Preview zoom">
            <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
            <button id="zoom-fit" type="button">Fit</button>
            <button id="zoom-actual" type="button">100%</button>
            <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
            <output id="zoom-level" aria-live="polite">100%</output>
          </div>
          <button id="download" class="primary" type="button">Download PNG</button>
        </footer>
      </section>
      <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
