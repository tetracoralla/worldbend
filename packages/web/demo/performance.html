<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worldbend canvas performance probe</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
    <style>
      :root { color-scheme: dark; font: 14px/1.4 system-ui, sans-serif; }
      body { margin: 0; background: #151515; color: #eee; }
      main { display: grid; grid-template-columns: minmax(560px, 1fr) 360px; width: 100vw; min-height: 100vh; margin: 0; border: 0; border-radius: 0; overflow: hidden; background: #151515; box-shadow: none; }
      #mount { display: grid; place-items: center; min-width: 0; overflow: hidden; background: #202020; }
      aside { padding: 16px; border-left: 1px solid #333; }
      h1 { margin: 0 0 12px; font-size: 16px; }
      p { color: #aaa; }
      button { min-height: 32px; margin: 0 8px 8px 0; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.5 ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <main>
      <div id="mount" aria-label="Performance transform preview"></div>
      <aside>
        <h1>Continuous canvas probe</h1>
        <p id="status" role="status">Loading the real editor…</p>
        <button id="start" type="button" disabled>Start observation</button>
        <button id="stop" type="button" disabled>Stop observation</button>
        <button id="dispose" type="button" disabled>Dispose editor</button>
        <label for="warp">Warp amount</label>
        <input id="warp" type="range" min="-1" max="1" step="0.001" value="0" disabled />
        <button id="warp-sample" type="button" disabled>Next warp sample</button>
        <pre id="output" aria-label="Performance observation"></pre>
      </aside>
    </main>
    <script type="module" src="./performance.ts"></script>
  </body>
</html>
