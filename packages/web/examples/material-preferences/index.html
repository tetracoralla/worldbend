<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worldbend · Personal materials</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f1e8;color:#172725;font:16px Arial,sans-serif}header{display:flex;justify-content:space-between;padding:24px 4vw;border-bottom:1px solid #ccd0c4;font-size:12px;letter-spacing:.08em}main{max-width:1180px;margin:45px auto;padding:0 4vw;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:50px;align-items:center}nav{display:flex;gap:6px;margin-bottom:22px}button{font:inherit;cursor:pointer;min-height:44px;padding:10px 15px;border:1px solid #758478;color:inherit;background:transparent;border-radius:3px}button[aria-pressed=true],#apply{background:#172725;color:#fff}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #277d87;outline-offset:3px}.book{aspect-ratio:3/4;max-width:480px;margin:auto;position:relative;background:#e9e5d7;border-radius:2px;padding:38px 30px;box-shadow:-10px 8px 0 #c7c6b8,0 25px 40px #283c2526;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.book small{font-size:11px;letter-spacing:.12em}.book h1{font-size:clamp(32px,4.8vw,67px);line-height:1.07;margin:35px 0 auto;letter-spacing:-1.7px;position:relative;z-index:1}.book .date{font-size:13px}.book.mesh{color:#fff;text-shadow:0 2px 10px #16215466}aside h2{font-size:27px;letter-spacing:-.8px;margin:0 0 24px}label{display:block;font-size:13px;margin-top:22px}input[type=range]{width:100%;min-height:36px;accent-color:#277d87}input[type=color]{width:100%;height:42px;margin-top:10px;border:1px solid #758478;background:transparent}label[for=amount]{display:flex;justify-content:space-between;gap:12px}output{font-size:13px;font-variant-numeric:tabular-nums}.actions{display:flex;gap:8px;margin-top:28px}.secondary{border-top:1px solid #ccd0c4;margin-top:22px;padding-top:22px;display:grid;gap:10px}#status{font-size:13px;line-height:1.5;color:#526159;min-height:40px;margin-top:20px}.empty{display:none}@media(max-width:720px){header{padding:20px}main{grid-template-columns:1fr;gap:38px;margin:25px auto;padding:0 25px}.book{max-width:360px}.book h1{font-size:50px}aside{padding-bottom:20px}nav{justify-content:center}}</style></head><body>
<header><span>WORLDBEND / FIELD NOTES</span><span>Personal materials</span></header>
<main><section><nav aria-label="Material"><button data-family="texture">Paper</button><button data-family="foil">Foil</button><button data-family="mesh-gradient">Fluid light</button></nav>
<article id="book" class="book"><small>FIELD NOTES</small><h1>Across<br>the ordinary.</h1><span class="date">2026 / 10</span></article></section>
<aside><h2>Your material</h2><label for="amount"><span id="amount-label">Grain</span><output id="amount-value" aria-hidden="true"></output></label><input id="amount" type="range" min="0" max="1" step=".01" disabled>
<label for="tint">Tint</label><input id="tint" type="color" disabled>
<div class="actions"><button id="apply" disabled>Apply</button><button id="cancel" disabled>Cancel</button></div>
<div class="secondary"><button id="reset" disabled>Use design defaults</button><button id="design" disabled>Next design</button><button id="retry" hidden>Save again</button></div>
<p id="status" role="status">Preparing material…</p></aside></main>
<script type="module">
import {attachMaterialPreference} from '../../dist/material-preference.js';
const fixtures=await(await fetch('./inputs.json')).json(),host=document.getElementById('book'),status=document.getElementById('status'),amount=document.getElementById('amount'),tint=document.getElementById('tint');
const apply=document.getElementById('apply'),cancel=document.getElementById('cancel'),reset=document.getElementById('reset'),design=document.getElementById('design');
const fields={texture:['grain','grain-color','Grain'],foil:['roughness','base-color','Softness'],'mesh-gradient':['softness','color-tl','Blending']};
let storageUnavailable=false;
const readSaved=key=>{try{return localStorage.getItem(key)}catch{storageUnavailable=true;return null}};
const savedFamily=readSaved('worldbend.material-study.family');
let family=['texture','foil','mesh-gradient'].includes(savedFamily)?savedFamily:'texture',session,designV2=readSaved('worldbend.material-study.design')==='2',sequence=0,creating;
const retry=document.getElementById('retry');
const key=family=>'worldbend.material-study.preference.'+family;
const sourceFor=(family,v2)=>{const source=structuredClone(fixtures[family].source);if(v2){source.recipe.recipeVersion=2;const property={texture:'grain',foil:'roughness','mesh-gradient':'softness'}[family];source.material[property]=.85;source.recipe.material[property]=.85;}return source};
const display=()=>{const state=session.getState(),p=(state.preview??state.output).plan,rows=p.controls;
 const scalar=rows.find(row=>row.field===fields[family][0]),color=rows.find(row=>row.field===fields[family][1]);
 amount.value=String(scalar.current.value);document.getElementById('amount-value').textContent=Number(amount.value).toFixed(2);document.getElementById('amount-label').textContent=fields[family][2];
 const value=color.current.value;tint.value=typeof value==='string'?value:'#'+[value.r,value.g,value.b].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');
 amount.disabled=tint.disabled=reset.disabled=design.disabled=false;apply.disabled=cancel.disabled=!state.previewing;
 design.textContent=designV2?'Original design':'Next design';host.classList.toggle('mesh',family==='mesh-gradient');host.querySelector('.date').textContent=designV2?'2027 / 02':'2026 / 10';
 document.querySelectorAll('[data-family]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.family===family)));
};
const save=()=>{try{localStorage.setItem(key(family),session.exportPreference());localStorage.setItem('worldbend.material-study.design',designV2?'2':'1');localStorage.setItem('worldbend.material-study.family',family);status.textContent='Saved for this book';retry.hidden=true}catch(error){status.textContent='Your material is applied; saving failed. Try again.';retry.hidden=false}};
const perform=action=>{try{action()}catch(error){status.textContent=error.message}finally{if(session)display()}};
async function choose(next){const ticket=++sequence;creating?.abort();creating=new AbortController();session?.destroy();session=undefined;family=next;host.classList.remove('mesh');document.querySelectorAll('[data-family]').forEach(button=>button.setAttribute('aria-pressed','false'));retry.hidden=true;status.textContent='Preparing material…';amount.disabled=tint.disabled=apply.disabled=cancel.disabled=reset.disabled=design.disabled=true;
 try{const input=structuredClone(fixtures[next]);input.source=sourceFor(next,designV2);const created=await attachMaterialPreference(host,input,{signal:creating.signal});if(ticket!==sequence){created.destroy();return}session=created;
 const saved=readSaved(key(next));if(saved){try{session.restorePreference(saved,session.getState().guard);status.textContent='Your saved material'}catch(error){status.textContent='Saved material unavailable: '+error.message}}else status.textContent=storageUnavailable?'Personal settings unavailable; changes stay in this session.':'Design defaults';display();
 }catch(error){if(ticket===sequence)status.textContent=error.message}
}
document.querySelectorAll('[data-family]').forEach(button=>button.onclick=()=>choose(button.dataset.family));
amount.oninput=()=>{const requested=Number(amount.value);perform(()=>{session.preview({[fields[family][0]]:{kind:'number',value:requested}},session.getState().guard);status.textContent='Preview · apply to keep'})};
tint.oninput=()=>{const requested=tint.value;perform(()=>{const state=session.getState(),row=(state.preview??state.output).plan.controls.find(row=>row.field===fields[family][1]);const value=family==='texture'?{kind:'hex-color',value:requested}:{kind:'rgba',value:{r:parseInt(requested.slice(1,3),16)/255,g:parseInt(requested.slice(3,5),16)/255,b:parseInt(requested.slice(5,7),16)/255,a:row.current.value.a}};session.preview({[fields[family][1]]:value},state.guard);status.textContent='Preview · apply to keep'})};
apply.onclick=()=>perform(()=>{session.applyPreview(session.getState().guard);save()});cancel.onclick=()=>perform(()=>{session.cancelPreview();status.textContent='Preview cancelled'});
reset.onclick=()=>perform(()=>{session.reset(session.getState().guard);save();if(retry.hidden)status.textContent='Design defaults'});
retry.onclick=()=>perform(save);
design.onclick=()=>perform(()=>{const next=!designV2,state=session.getState();session.revise(sourceFor(family,next),state.input.policy,state.guard);designV2=next;save();design.textContent=next?'Original design':'Next design';if(retry.hidden)status.textContent='Design updated · personal choices retained'});
await choose(family);
globalThis.materialStudy={get session(){return session},get family(){return family},fixtures,choose,sourceFor,host};
window.addEventListener('pagehide',()=>{sequence++;creating?.abort();session?.destroy()},{once:true});
</script></body></html>
