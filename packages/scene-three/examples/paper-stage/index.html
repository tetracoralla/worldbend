<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Field Notes · Worldbend</title>
<style>
:root{color-scheme:light;font-family:Arial,sans-serif;color:#1d332b;background:#f4f0e6}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:0 auto;padding:24px 32px}header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #a3ac9b;padding:8px 0 18px}h1{font-size:24px;letter-spacing:-.8px;margin:0}header small{letter-spacing:.12em;font-size:10px}.stage{position:relative;max-width:920px;margin:18px auto 0;aspect-ratio:4/3;background:#ded8c1;overflow:hidden}.stage:empty:after{content:'正在打开作品…';position:absolute;inset:0;display:grid;place-items:center}.transport{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:16px;border-bottom:1px solid #a3ac9b;padding:14px 0}input[type=range]{flex:1;accent-color:#294e3e;min-width:40px}output{font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}.tools{display:flex;flex-wrap:wrap;gap:9px;max-width:920px;margin:18px auto;align-items:center}button,.file{appearance:none;background:transparent;color:inherit;border:1px solid #b1b9a8;padding:10px 14px;border-radius:3px;font:inherit;font-size:12px;cursor:pointer}button:hover,.file:hover{background:#e6e8da}button:focus-visible,input:focus-visible,.file:focus-within{outline:2px solid #426b50;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.primary{background:#274b3b;color:#fff;border-color:#274b3b}.primary:hover{background:#345b47}.file:has(input:disabled){opacity:.4;cursor:default}.file input{position:absolute;width:1px;height:1px;opacity:0}.tools .spacer{flex:1}.note{max-width:920px;margin:0 auto;font-size:12px;min-height:24px;line-height:1.6;color:#556657}.note.error{color:#a12c22}a{color:inherit}footer{display:flex;justify-content:space-between;max-width:920px;margin:24px auto 0;font-size:10px;letter-spacing:.1em}#flat{width:20px;height:28px;object-fit:contain;vertical-align:middle;margin-right:8px}@media(max-width:620px){main{padding:16px}header{padding-bottom:12px}.stage{margin-top:16px}.tools{gap:7px}button,.file{padding:10px}.tools .spacer{display:none}header small{font-size:8px}footer{gap:16px}.transport{gap:10px}}
.source-panel{max-width:920px;margin:18px auto;padding:18px;border:1px solid #a3ac9b;background:#ecebdd}.source-panel h2{margin:0 0 12px;font-size:16px;font-weight:500}.source-panel p,#provenance{font-size:12px;line-height:1.7}.source-panel p{margin:7px 0}.source-actions{display:flex;gap:10px;margin-top:16px}button,.file{min-height:44px}#provenance{max-width:920px;margin:12px auto 0;color:#556657;min-height:22px}
</style>
<style>fieldset{border:0;margin:14px 0 0;padding:0;min-width:0}legend{font-size:12px;padding:0}.conflict-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.conflict-options label{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px;border:1px solid #b1b9a8;border-radius:3px;font-size:12px;cursor:pointer}.conflict-options label:has(input:checked){background:#dde3d3;border-color:#426b50}.conflict-options input{accent-color:#294e3e;margin:0}</style>
<main><header><h1>Field Notes</h1><small>WORLDBEND / PAPER THEATRE</small></header>
<section id="stage" class="stage" aria-label="纸质微缩舞台"></section>
<div class="transport"><button id="play" disabled aria-label="播放镜头">播放</button><input id="time" type="range" min="0" max="4000" step="1" value="1625" aria-label="镜头时间"><output id="clock">0:00 / 0:04</output></div>
<div class="tools"><button id="cover" class="primary">换封面</button><button id="scene">接续 Blender 修改</button><button id="view">正面</button><button id="retime">延长到 6 秒</button><button id="undo" disabled>撤销</button><span class="spacer"></span><button id="png">保存画面</button><button id="save">保存作品</button><label class="file">打开作品<input id="open" type="file" accept="application/json,.json"></label><button id="record" hidden>取回原记录</button><button id="retry" hidden>重试</button></div>
<p id="status" class="note" role="status" aria-live="polite">正在准备作品。</p>
<section id="source-panel" class="source-panel" aria-labelledby="source-title" hidden><h2 id="source-title"></h2><p id="source-summary"></p><p id="source-preserved"></p><div id="source-conflicts"></div><div class="source-actions"><button id="apply-source" class="primary">接续这一版</button><button id="cancel-source">保留当前作品</button></div></section>
<p id="provenance"></p>
<footer><span><img id="flat" alt="共享封面" hidden>EDITION <span id="edition">01</span></span><a id="blend" href="./assets/edition-1/scene.blend" download>BLENDER SOURCE ↗</a></footer>
</main><script type="module" src="./main.ts"></script></html>
